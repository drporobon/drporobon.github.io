    <style>
        #map {
            height: 600px;
            width: 100%;
        }

        /* Animación CSS para parpadeo */
        .blinking-circle {
          animation: blink 1s infinite;
        }

        @keyframes blink {
          0%, 100% {
            opacity: 1;
          }
          50% {
            opacity: 0;
          }
        }
        
        /* Definimos la animación de movimiento */
        @keyframes fluir {
            to {
                stroke-dashoffset: -20;
            }
        }

        /* Aplicamos la animación a nuestra línea personalizada */
        .linea-animada {
            animation: fluir 1s linear infinite;
        }
    </style>
</head>
<body>

                <nombre>Chiringuito Rissolee</nombre>

            <punto>

                <longitud>-4.499258344343108</longitud>
                <nombre>Chiringuito La Coquina Playa</nombre>
                <descripcion>descripcion de Chiringuito La Coquina Playa</descripcion>
                <precio>8</precio>
                <tipo>7</tipo>
            </punto>
        </ubicaciones>
    `;

    // 1. Inicializar el mapa con límites geográficos
    const bounds = L.latLngBounds(
      [36.307, -4.454],
      [36.907, -4.554]
    );

    const map = L.map('map', {
        center: [36.60754967575224, -4.504895610729976],
        zoom: 15,        // Zoom inicial
        maxZoom: 18,    // Zoom máximo permitido
        minZoom: 15,     // Zoom mínimo
        maxBounds: bounds,
        maxBoundsViscosity: 1.0 
    });
    
    const calle = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    const limpio = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
    const limpioDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');

    // Establecer capa limpia por defecto
    limpio.addTo(map);

    // Parsear el XML
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlData, "application/xml");
    const puntos = xmlDoc.getElementsByTagName("punto");
    
    let coordenadasLinea = [];
    let marcadoresIntermedios = []; // Guardará los marcadores que se controlan por zoom

    // Procesar nodos <punto>
    for (let i = 0; i < puntos.length; i++) {
        let punto = puntos[i];
        let lat = parseFloat(punto.getElementsByTagName("latitud")[0].textContent);
        let lon = parseFloat(punto.getElementsByTagName("longitud")[0].textContent);
        let nombre = punto.getElementsByTagName("nombre")[0].textContent;
        let coords = [lat, lon];
        
        // El primero y el último son fijos (Origen y Destino)
        if (i === 0 || i === (puntos.length - 1)) {
            if (i === 0) {
                L.marker(coords, {
                    icon: L.icon({
                        iconUrl: 'https://cdn-icons-png.flaticon.com/128/10109/10109952.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                        iconSize: [40, 40],
                        iconAnchor: [20, 40],
                        popupAnchor: [0, -40]
                    })
                }).addTo(map).bindPopup(`<b>Inicio: ${nombre}</b>`);
            }
            if (i === (puntos.length - 1)) {         
                L.marker(coords, {
                    icon: L.icon({
                        iconUrl: 'https://cdn-icons-png.flaticon.com/128/1247/1247940.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                        iconSize: [40, 40],
                        iconAnchor: [20, 40],
                        popupAnchor: [0, -40]
                    })
                }).addTo(map).bindPopup(`<b>Fin: ${nombre}</b>`);
            }
        } else {
            // Los puntos intermedios usarán el sistema condicional.
            // Para cambiar su diseño, usamos tus Extra-markers cargados en el head
            let iconoChiringuito = L.ExtraMarkers.icon({
                icon: 'fa-beer',
                markerColor: 'cyan',
                shape: 'circle',
                prefix: 'fa'
            });

            let marcador = L.marker(coords, { icon: iconoChiringuito })
                            .bindPopup(`<b>${nombre}</b><br>Precio medio: ${punto.getElementsByTagName("precio")[0].textContent}€`);

            // Guardamos la información de visibilidad
            marcadoresIntermedios.push({
                instancia: marcador,
                coordenadas: coords
            });
        }

        coordenadasLinea.push(coords);
    }   
    
    // Dibujar la línea de la ruta
    if (coordenadasLinea.length > 1) {
        let rutaAnimada = L.polyline(coordenadasLinea, {
            color: '#2A75D3',       // Color de la ruta
            weight: 5,              // Grosor
            opacity: 0.8,
            dashArray: '10, 10',    // '10px de línea, 10px de espacio'
            className: 'linea-animada' 
        }).addTo(map);
        
        map.fitBounds(rutaAnimada.getBounds());
    }

    // Regla de visualización para los marcadores intermedios
    const ZOOM_MINIMO = 16; // Solo se ven los chiringuitos intermedios si el zoom es igual o superior a 16

    function actualizarVisibilidad() {
        const zoomActual = map.getZoom();
        const limitesVisibles = map.getBounds();
        const tieneBuenZoom = zoomActual >= ZOOM_MINIMO;

        marcadoresIntermedios.forEach(item => {
            const estaEnZona = limitesVisibles.contains(item.coordenadas);

            if (tieneBuenZoom && estaEnZona) {
                if (!map.hasLayer(item.instancia)) {
                    item.instancia.addTo(map);
                }
            } else {
                if (map.hasLayer(item.instancia)) {
                    map.removeLayer(item.instancia);
                }
            }
        });
    }

    // Escuchar eventos
    map.on('moveend', actualizarVisibilidad);
    actualizarVisibilidad(); // Llamada inicial al arrancar
</script>
