  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f5f5;
      font-family: "Inter", system-ui, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Caja de botones dentro del mapa */
    .map-buttons {
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 8px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Botones base */
    .map-buttons button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
      background-color: #e0e0e0;
      color: #333;
      transition: all 0.2s ease;
    }

    /* Hover suave */
    .map-buttons button:hover {
      background-color: #d0d0d0;
    }

    /* Botón activo */
    .map-buttons button.active {
      background-color: #d62828;
      color: white;
      font-weight: 600;
    }

    /* Iconos emoji */
    .wc-icon, .cafe-icon {
      font-size: 22px;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    /* Animación CSS para parpadeo */
    .blinking-circle {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }
	
    .leyenda {
      background: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
  </style>
</head>

    // Cargar XML desde el HTML
    function loadXML(id) {
      markersLayer.clearLayers();
      const xmlString = document.getElementById(id).textContent.trim();
      const xmlDoc = new DOMParser().parseFromString(xmlString, 'text/xml');
      const items = xmlDoc.getElementsByTagName('marker');

      for (let i = 0; i < items.length; i++) {
        const lat = parseFloat(items[i].getAttribute('lat'));
        const lng = parseFloat(items[i].getAttribute('lng'));
        const tipo = items[i].getAttribute('type');
		const idMarker = items[i].getAttribute('id');
		const tipoTienda = items[i].getAttribute('tipoTienda');
        const nombre = items[i].getAttribute('name');
        const info = items[i].getAttribute('info');

        //const marker = L.marker([lat, lng], { icon: icons[tipo] }).addTo(markersLayer);
        //marker.bindPopup(`<b>${nombre}</b><br/>${info}`);
		
		let opacidad=1;
		let clase='';
		let color='';
		if(idURL!=null){
			if(idMarker == idURL){
				opacidad = 1;
				clase = 'blinking-circle';
				color = 'red';
				hayRojo = 1;
			}else{
				opacidad = 0.3;
				clase = 'none';
				color = 'gray';
			}
		}else if(idTipoURL!=null){
			if(tipoTienda == idTipoURL){
				opacidad = 1;
				clase = 'blinking-circle';
				color = 'red';
				hayRojo = 1;
			}else{
				opacidad = 0.3;
				clase = 'none';
				color = 'gray';
			}
		}
		
		const marker = L.circleMarker([lat, lng], {
			radius: 8,
			fillColor: color,
			fillOpacity: opacidad,
			className: clase,
			stroke: false // Esto quita el borde
		}).addTo(map);
		
		marker.bindPopup(nombre);
		marker.setPopupContent('<b>'+nombre+'</b><br/>'+info);
		markersLayer.addLayer(marker);
      }
    }
