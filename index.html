<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Inicio</title>
  <style>
    /* RESET Y ESTILOS GLOBALES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: #2c3e50;
    }

    /* CONTENEDOR DE TARJETAS / BOTONES */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    /* ENLACES TIPO TARJETA */
    .card-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 1px solid #e1e8ed;
      border-radius: 12px;
      padding: 30px 20px;
      text-decoration: none;
      color: #2c3e50;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
    }

    /* EFECTOS AL PASAR EL CURSOR (HOVER) */
    .card-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }

    /* ESTILO DE LAS IMÁGENES / ICONOS */
    .card-button img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    .card-button:hover img {
      transform: scale(1.05);
    }

    /* TEXTO DEL BOTÓN */
    .card-button span {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* CLASE ESPECIAL PARA LA VELA (OPCIONAL) */
    .card-button.candle:hover {
      border-color: #f59e0b;
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.15);
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenido</h1>
  </header>

  <main class="grid-container">
    
    <!-- BOTÓN 1: HISTORIAS -->
    <a href="index_historias.html" class="card-button">
      <img src="https://img.icons8.com/isometric-line/100/open-book.png" alt="Historias">
      <span>Historias</span>
    </a>

    <!-- BOTÓN 2: MAPAS -->
    <a href="https://drporobon.github.io/index_mapas.html" class="card-button">
      <img src="https://img.icons8.com/isometric-line/100/map.png" alt="Mapas">
      <span>Mapas</span>
    </a>

    <!-- BOTÓN 3: ENCENDER UNA VELA -->
    <a href="vela.html" class="card-button candle">
      <img src="https://cdn-icons-png.flaticon.com/512/2142/2142717.png" alt="Encender Vela">
      <span>Encender una Vela</span>
    </a>

  </main>

</body>
</html>
