  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f5f5;
      font-family: "Inter", system-ui, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Caja de botones dentro del mapa */
    .map-buttons {
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 8px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Botones base */
    .map-buttons button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
      background-color: #e0e0e0;
      color: #333;
      transition: all 0.2s ease;
    }

    /* Hover suave */
    .map-buttons button:hover {
      background-color: #d0d0d0;
    }

    /* Botón activo */
    .map-buttons button.active {
      background-color: #d62828;
      color: white;
      font-weight: 600;
    }

    /* Transforma el mapa colorido de OSM en un mapa limpio y minimalista */
    .mapa-minimalista {
        filter: grayscale(100%) brightness(115%) contrast(90%);
    }
    
    .mapa-calles-limpias {
        filter: grayscale(100%) contrast(150%) brightness(110%);
    }
        
        /* Definimos la animación de movimiento */
        @keyframes fluir {
            to {
                stroke-dashoffset: -20;
            }
        }

        /* Aplicamos la animación a nuestra línea personalizada */
        .linea-animada {
            animation: fluir 1s linear infinite;
        }
  </style>
</head>

    );

    const map = L.map('map', {
        center: [36.60754967575224, -4.504895610729976],
        zoom: 15,        // Zoom inicial
        maxZoom: 18,    // Zoom máximo permitido
        minZoom: 15,     // Zoom mínimo
        maxBounds: bounds,
        maxBoundsViscosity: 1.0 
    });

    // 2. Cargar la capa base de OpenStreetMap	
	const limpio = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=cb1_31xy_1_cb67f567f488abf973d7ffaa', {
      attribution: '&copy; OpenStreetMap & CartoDB',
    }).addTo(map);

    // 3. Aplicar tu filtro minimalista CSS al contenedor de las teselas
    limpio.getContainer().classList.add('mapa-minimalista');

    // 4. Leer y procesar el contenido XML integrado
    const xmlText = document.getElementById('p1').textContent;

    const puntos = xmlDoc.getElementsByTagName("punto");
