<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa minimalista con XML y botones</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f5f5;
      font-family: "Inter", system-ui, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Caja de botones dentro del mapa */
    .map-buttons {
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 8px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Botones base */
    .map-buttons button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
      background-color: #e0e0e0;
      color: #333;
      transition: all 0.2s ease;
    }

    .map-buttons button:hover {
      background-color: #d0d0d0;
    }

    /* Botón activo */
    .map-buttons button.active {
      background-color: #d62828;
      color: white;
      font-weight: 600;
    }

    /* Iconos emoji */
    .wc-icon, .cafe-icon {
      font-size: 22px;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    /* Animación CSS para parpadeo */
    .blinking-circle {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
	
    .leyenda {
      background: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // Configuración de límites y mapa centrado
    const bounds = L.latLngBounds(
      [40.49383, -3.36174],
      [40.49642, -3.35633]
    );

    const map = L.map('map', {
      center: [40.49500, -3.35943],
      zoom: 18,
      maxZoom: 18,
      minZoom: 18,
      zoomControl: false,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0
    });	
	
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap & CartoDB',
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
	
    let xmlGlobalDoc = null; 
    let hayRojo = 0;

    // Capturamos parámetros de la URL
    const params = new URLSearchParams(window.location.search);	
    let idURL = params.get('idMap') || params.get('id'); 
    let idTipoURL = params.get('idTipo');

    // Función auxiliar segura para extraer texto de los nodos
    function getVal(parent, tagName) {
      const element = parent.getElementsByTagName(tagName)[0];
      return element ? element.textContent.trim() : '';
    }
	
    function loadXMLLayer(targetPlantaId) {
      if (!xmlGlobalDoc) return;
      markersLayer.clearLayers();
      hayRojo = 0;

      const items = xmlGlobalDoc.getElementsByTagName('punto');

      for (let i = 0; i < items.length; i++) {
        const tipo = getVal(items[i], 'type');
        const latStr = getVal(items[i], 'lat');
        const lngStr = getVal(items[i], 'lng');
        
        // Control de seguridad: Si el punto no pertenece a esta planta o no tiene coordenadas, saltarlo
        if (tipo !== targetPlantaId || !latStr || !lngStr) continue;

        const lat = parseFloat(latStr);
        const lng = parseFloat(lngStr);
        const idMarker = getVal(items[i], 'id');
        const idTipoNodo = getVal(items[i], 'idTipo');
        const tipoTiendaNodo = getVal(items[i], 'tipoTienda');
        const nombre = getVal(items[i], 'name') || getVal(items[i], 'texto'); // Fallback si 'name' está vacío
        const info = getVal(items[i], 'info') || getVal(items[i], 'tipo');

        let opacidad = 1;
        let clase = '';
        let color = '';

        // --- FILTRO POR ID UNICO (?idMap=X o ?id=X) ---
        if (idURL != null) {
          if (idMarker == idURL) {
            opacidad = 1;
            clase = 'blinking-circle';
            color = 'red';
            hayRojo = 1;
          } else {
            opacidad = 0.3;
            clase = 'none';
            color = 'gray';
          }
        } 
        // --- FILTRO POR CATEGORÍA (?idTipo=X) ---
        else if (idTipoURL != null) {
          // Comprobamos contra idTipo o tipoTienda indistintamente
          if (idTipoNodo == idTipoURL || tipoTiendaNodo == idTipoURL) {
            opacidad = 1;
            clase = 'blinking-circle'; // Todos los de este tipo parpadean en rojo
            color = 'red';
            hayRojo = 1;
          } else {
            // Si filtramos por categoría, las demás tiendas NO se dibujan
            continue;
          }
        } 
        // --- NAVEGACIÓN NORMAL (Sin parámetros en URL) ---
        else {
          color = 'red';
          opacidad = 1;
        }
		
        const marker = L.circleMarker([lat, lng], {
          radius: 8,
          fillColor: color,
          fillOpacity: opacidad,
          className: clase,
          stroke: false
        });
		
        marker.bindPopup('<b>' + nombre + '</b><br/>' + info);
        markersLayer.addLayer(marker);
      }
    }
	
    function processUrlRouting() {
      if (!xmlGlobalDoc) return;
      const items = xmlGlobalDoc.getElementsByTagName('punto');
      
      let plantaDestino = null;
      let tiposConCoincidencia = new Set();

      for (let i = 0; i < items.length; i++) {
        const tipo = getVal(items[i], 'type');
        const idMarker = getVal(items[i], 'id');
        const idTipoNodo = getVal(items[i], 'idTipo');
        const tipoTiendaNodo = getVal(items[i], 'tipoTienda');

        // Ignorar puntos sin planta definida
        if (!tipo) continue;

        if (idURL && idMarker == idURL) {
          plantaDestino = tipo;
          break; 
        }
        
        if (idTipoURL && (idTipoNodo == idTipoURL || tipoTiendaNodo == idTipoURL)) {
          tiposConCoincidencia.add(tipo);
        }
      }

      if (plantaDestino) {
        loadXMLLayer(plantaDestino);
        setActive(document.getElementById('btn' + plantaDestino.toUpperCase()));
      } else if (idTipoURL && tiposConCoincidencia.size > 0) {
        // Enrutamiento en cascada idéntico: p0 -> p1 -> p11
        if (tiposConCoincidencia.has('p0')) {
          loadXMLLayer('p0');
          setActive(document.getElementById('btnP0'));
        } else if (tiposConCoincidencia.has('p1')) {
          loadXMLLayer('p1');
          setActive(document.getElementById('btnP1'));
        } else if (tiposConCoincidencia.has('p11')) {
          loadXMLLayer('p11');
          setActive(document.getElementById('btnP11'));
        }
      } else {
        loadXMLLayer('p0');
        setActive(document.getElementById('btnP0'));
      }
    }

    async function initData() {
      try {
        const respuesta = await fetch('preMap2.xml');
        if (!respuesta.ok) throw new Error('No se pudo leer el archivo preMap2.xml');
        const xmlTexto = await respuesta.text();
        xmlGlobalDoc = new DOMParser().parseFromString(xmlTexto, 'text/xml');
        processUrlRouting();
      } catch (error) {
        console.error("Error cargando los puntos desde el XML:", error);
      }
    }

    // Botones del mapa
    const ButtonsControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const div = L.DomUtil.create('div', 'map-buttons');
        div.innerHTML = `
          <button id="btnP1">Planta 1</button>
          <button id="btnP0">Planta 0</button>
          <button id="btnP11">Planta -1</button>
        `;
        L.DomEvent.disableClickPropagation(div);
        return div;
      },
    });

    map.addControl(new ButtonsControl());

    const btnP1 = document.getElementById('btnP1');
    const btnP0 = document.getElementById('btnP0');
    const btnP11 = document.getElementById('btnP11');
    const buttons = [btnP1, btnP0, btnP11];

    function setActive(activeButton) {
      if (!activeButton) return;
      buttons.forEach(btn => btn.classList.remove('active'));
      activeButton.classList.add('active');
    }
	
    btnP1.onclick = () => { loadXMLLayer('p1'); setActive(btnP1); };
    btnP0.onclick = () => { loadXMLLayer('p0'); setActive(btnP0); };
    btnP11.onclick = () => { loadXMLLayer('p11'); setActive(btnP11); };

    // Capas de baños comunes fijas
    const wcIcon = L.divIcon({
      html: '<div class="wc-icon">🚻</div>',
      className: '',
      iconSize: [20, 20],
      iconAnchor: [15, 15],
      popupAnchor: [0, -15]
    });

    L.marker([40.49528, -3.35991], { icon: wcIcon }).addTo(map).bindPopup('<b>Baño público</b>');
    L.marker([40.49447, -3.35917], { icon: wcIcon }).addTo(map).bindPopup('<b>Baño público</b>');

    const doorIcon = L.divIcon({
      html: '<i class="fas fa-door-closed fa-2x"></i>',
      className: '',
      iconSize: [25, 25]
    });
    L.marker([40.49498, -3.35994], { icon: doorIcon }).addTo(map);

    const leyenda = L.control({ position: 'bottomleft' });
    leyenda.onAdd = function () {
      const div = L.DomUtil.create('div', 'leyenda');
      div.innerHTML = '<strong>Texto Aleatorio</strong>';
      return div;
    };
    leyenda.addTo(map);

    initData();
  </script>
</body>
</html>
