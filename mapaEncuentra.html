<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar marcador por Zoom y Zona</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 500px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicializar el mapa
        const map = L.map('map').setView([40.4167, -3.7037], 6); // Centrado en España
		
const calle = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const limpio = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
const limpioDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');

// Establecer uno por defecto
limpio.addTo(map);

        /*L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);*/

        // 2. Definir las coordenadas del marcador y crear el objeto (sin añadirlo al mapa todavía)
        const posicionMarcador = [40.4167, -3.7037]; // Madrid
        const miMarcador = L.marker(posicionMarcador).bindPopup("¡Hola! Solo aparezco con zoom alto aquí.");

        // 3. Configurar las reglas de visualización
        const ZOOM_MINIMO = 18; // Solo visible si el zoom es 10 o mayor

        function actualizarVisibilidadMarcador() {
            const zoomActual = map.getZoom();
            
            // Obtiene los límites (rectángulo) de la zona que el usuario está viendo ahora mismo
            const limitesVisibles = map.getBounds(); 

            // Condición 1: ¿El zoom es suficiente?
            const tieneBuenZoom = zoomActual >= ZOOM_MINIMO;

            // Condición 2: ¿La coordenada del marcador está dentro de lo que el usuario ve en pantalla?
            const estaEnZonaVisible = limitesVisibles.contains(posicionMarcador);

            // Si cumple ambas condiciones, lo mostramos; si no, lo quitamos
            if (tieneBuenZoom && estaEnZonaVisible) {
                // Solo lo añadimos si no está ya en el mapa para evitar redundancias
                if (!map.hasLayer(miMarcador)) {
                    miMarcador.addTo(map);
                }
            } else {
                // Lo quitamos del mapa si deja de cumplir alguna condición
                if (map.hasLayer(miMarcador)) {
                    map.removeLayer(miMarcador);
                }
            }
        }

        // 4. Escuchar los eventos del mapa
        // 'moveend' se dispara cuando el usuario termina de arrastrar o hacer zoom en el mapa
        map.on('moveend', actualizarVisibilidadMarcador);

        // Ejecutar una vez al cargar la página para comprobar el estado inicial
        actualizarVisibilidadMarcador();
    </script>
</body>
</html>
