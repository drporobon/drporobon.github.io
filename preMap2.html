<!DOCTYPE html>
<html>
<head>
    <title>Index</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
    </style>
</head>
<body>

  <div id="resultado">
	<ul id="lista-tipos"></ul>
  </div>
  
  
<script type="text/xml" id="mapas">
	<!--
  <mapas>
    <mapa id="1" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Puntos de Interés" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
    <mapa id="2" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Juntas de Distrito" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
    <mapa id="3" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Nidos de Cigüeñas" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
    <mapa id="10" tipoMapa="paginaMapa4" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Centro Comercial Alcalá Magna" boundsLat1="40.49383" boundsLng1="-3.36174" boundsLat2="40.49642" boundsLng2="-3.35633"/>
    <mapa id="50" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Mercado Cervantino" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
  </mapas>
	-->
</script>
<script>
    const params = new URLSearchParams(window.location.search);    
    let idURL = params.get('id');

    const contenedor = document.getElementById('resultado');
    const ulTipos = document.getElementById("lista-tipos"); // Asegúrate de tener este elemento en tu HTML

    // Crear un Map global para guardar solo los tipos únicos
    let mapaTipos = new Map();

    // Función genérica para descargar y parsear cualquier XML
    async function fetchXML(url) {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("Error al cargar el archivo: " + url);
        const xmlString = await respuesta.text();
        return new DOMParser().parseFromString(xmlString, 'text/xml');
    }

    // Proceso unificado y ordenado
    async function inicializarMapa(urlPuntos) {
        try {
            // 1. Cargamos ambos XML en paralelo (así no perdemos tiempo)
            const [xmlDoc, xmlDoc2] = await Promise.all([
                fetchXML(urlPuntos),
                fetchXML('mapas.xml')
            ]);

            // ==========================================
            // PROCESAR MAPAS (Equivalente a tu loadXML2)
            // ==========================================
            const items2 = xmlDoc2.getElementsByTagName('mapa');
            let idMap = 0;
            let redireccion = '';

            for (let i = 0; i < items2.length; i++) {
                const mapaId = items2[i].getAttribute('id');
                const tipoMapa = items2[i].getAttribute('tipoMapa');
                if (mapaId === idURL) {
                    idMap = mapaId;
                    redireccion = tipoMapa;        
                }
            }

            // ==========================================
            // PROCESAR TIPOS Y CREAR RELACIÓN
            // ==========================================
            let idTipoElements = xmlDoc.getElementsByTagName("idTipo");
            let tipoElements = xmlDoc.getElementsByTagName("tipo");

            for (let i = 0; i < idTipoElements.length; i++) {
                let idTipo = idTipoElements[i].textContent.trim();
                let tipo = tipoElements[i].textContent.trim();
                if (!mapaTipos.has(idTipo)) {
                    mapaTipos.set(idTipo, tipo);
                }
            }

            // Pintar la lista de tipos en el HTML
            if (ulTipos) {
                mapaTipos.forEach((tipo, idTipo) => {
                    let li = document.createElement("li");
                    li.innerHTML = `<a href="${redireccion}.html?idMap=${idMap}&idTipo=${idTipo}">${tipo}</a>`;
                    ulTipos.appendChild(li);
                });
            }

            // ==========================================
            // PROCESAR Y PINTAR PUNTOS (Equivalente a tu loadXML)
            // ==========================================
            let puntos = xmlDoc.getElementsByTagName('punto');
            
            for (let i = 0; i < puntos.length; i++) {
                let id = puntos[i].getElementsByTagName('id')[0].textContent;
                let texto = puntos[i].getElementsByTagName('texto')[0].textContent;

                let p = document.createElement('p');
                // Ahora redireccion e idMap TIENEN VALOR porque el código esperó de manera asíncrona
                p.innerHTML = `${texto}  <a href="${redireccion}.html?idMap=${idMap}&id=${id}">Mapa4</a>`;
                contenedor.appendChild(p);
            }

        } catch (error) {
            console.error("Hubo un problema procesando los datos:", error);
        }
    }

    // Determinar qué archivo cargar según el parámetro ID
    let archivoDestino = 'preMap1.xml'; // Por defecto
    if (idURL == 10) {
        archivoDestino = 'preMap2.xml';
    } else if (idURL == 11) {
        archivoDestino = 'preMap3.xml';
    } else if (idURL == 50) {
        archivoDestino = 'preMap4.xml';
    }

    // Iniciamos la carga
    inicializarMapa(archivoDestino);
</script>
</body>
</html>
