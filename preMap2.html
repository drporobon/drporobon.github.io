<html>

<body>

  <div id="resultado">
	<ul id="lista-tipos"></ul>
  </div>
  
  
<script type="text/xml" id="mapas">
  <mapas>
    <mapa id="1" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Puntos de Interés" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
    <mapa id="2" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Juntas de Distrito" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
    <mapa id="3" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Nidos de Cigüeñas" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
    <mapa id="10" tipoMapa="paginaMapa4" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Centro Comercial Alcalá Magna" boundsLat1="40.49383" boundsLng1="-3.36174" boundsLat2="40.49642" boundsLng2="-3.35633"/>
    <mapa id="50" tipoMapa="paginaMapaTurismo" nivel1="ES" nivel2="Com.Madrid" nivel3="Alcalá de Henares" nivel4="Mercado Cervantino" boundsLat1="40.468505717080504" boundsLng1="-3.3924260056572946" boundsLat2="40.51488636654535" boundsLng2="-3.3433270467341685"/>
  </mapas>
</script>

<script>

	const params = new URLSearchParams(window.location.search);	
	let idURL = params.get('id');

const contenedor = document.getElementById('resultado');

function loadXML(url) {
fetch(url)
	.then(respuesta => {
		if (!respuesta.ok) throw new Error("Error al cargar el archivo");
		return respuesta.text(); // Pasamos el contenido a texto
	})
	.then(xmlString => {
		
	// Parseamos el XML exactamente como lo hacías antes
		const xmlDoc = new DOMParser().parseFromString(xmlString, 'text/xml');
		const items = xmlDoc.getElementsByTagName('punto');

    let puntos = xmlDoc.getElementsByTagName('punto');
    
	let idTipoElements = xmlDoc.getElementsByTagName("idTipo");
	let tipoElements = xmlDoc.getElementsByTagName("tipo");
	// Crear un Set para guardar solo los valores únicos
	let mapaTipos = new Map();
	for (let i = 0; i < idTipoElements.length; i++) {
		let idTipo = idTipoElements[i].textContent.trim();
		let tipo = tipoElements[i].textContent.trim();
		// Guardamos la relación en el Map (si ya existe, se sobrescribe, pero como es el mismo valor no hay problema)
		if (!mapaTipos.has(idTipo)) {
			mapaTipos.set(idTipo, tipo);
		}
	}
		
    const xmlDoc2 = new DOMParser().parseFromString(xmlString, 'text/xml');
    const items2 = xmlDoc2.getElementsByTagName('punto');
	let idMap = 0;
	let redireccion = '';
	  
	for (let i = 0; i < items2.length; i++) {
		let mapaId = items2[i].getAttribute('id');
		let tipoMapa = items2[i].getAttribute('tipoMapa');
		if(mapaId===idURL){
			idMap = mapaId;
			redireccion = tipoMapa;		
		}
	}

	// Ahora recorremos el Map y creamos la lista
	const ul = document.getElementById("lista-tipos");
	mapaTipos.forEach((tipo, idTipo) => {
		const li = document.createElement("li");
		//li.textContent = `<a href="paginaMapa4.html?id=${idTipo}">${tipo}</a>`;
		li.innerHTML = `<a href="${redireccion}.html?idMap=${idMap}&idTipo=${idTipo}">${tipo}</a>`;
		ul.appendChild(li);
	});

    for (let i = 0; i < puntos.length; i++) {
      const id = puntos[i].getElementsByTagName('id')[0].textContent;
      const idTipo = puntos[i].getElementsByTagName('idTipo')[0].textContent;
      const tipo = puntos[i].getElementsByTagName('tipo')[0].textContent;
      const texto = puntos[i].getElementsByTagName('texto')[0].textContent;

      const p = document.createElement('p');
      //p.textContent = `ID: ${id} - Texto: ${texto}`;
      //p.innerHTML = `ID: ${id} - Texto: ${texto}  <a href="paginaMapa.html?id=${id}">Mapa</a>`;+
	  //p.innerHTML = `ID: ${id} - Texto: ${texto}  <a href="paginaMapa4.html?id=${id}">Mapa4</a>`;
	  p.innerHTML = `${texto}  <a href="${redireccion}.html?idMap=${idMap}&id=${id}">Mapa4</a>`;
      contenedor.appendChild(p);
    }
				
	})
	.catch(error => {
		console.error("Hubo un problema al leer el XML externo:", error);
	});
}

setTimeout(() => {
  
	loadXML('preMap1.xml');
	
	if(idURL==10){
		loadXML('preMap2.xml');
	}
	if(idURL==11){
		loadXML('preMap2.xml');
	}	
	if(idURL==50){
		loadXML('preMap4.xml');
	}
  
}, 300);


  

	

	
</script>
</body>
</html>
