function loadXML(url) {
fetch(url)
	.then(respuesta => {
		if (!respuesta.ok) throw new Error("Error al cargar el archivo");
		return respuesta.text(); // Pasamos el contenido a texto
	})

			texto = `${nivel1} <br/> >>> ${nivel2} <br/> >>> >>> ${nivel3}`;
			cambio = true;

			p.innerHTML = `>>> >>> >>> ${nivel4} <a href="preMap.html?id=${mapaId}">Mapa</a>`;

}
