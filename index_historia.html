<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El Misterio de la Taquilla 13</title>
    <style>
        /* Estilos modernos y limpios, ideales para leer en móvil o PC */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-top: 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        h2 {
            color: #34495e;
            font-size: 1.6rem;
        }
        p {
            line-height: 1.8;
            font-size: 1.3rem;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 200px;
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: left;
        }
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        button.restart {
            background-color: #e74c3c;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
        button.restart:hover {
            background-color: #c0392b;
        }
        /* Oculta los pasos por defecto */
        .step {
            display: none;
        }
        /* Clase especial para mostrar solo el paso activo */
        .active {
            display: block;
        }
        blockquote {
            margin: 15px 0;
            padding: 10px 15px;
            background: #ecf0f1;
            border-left: 5px solid #bdc3c7;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo">Cargando historia...</h1>
    <p id="texto"></p>
    <div id="opciones-container" class="btn-container"></div>
    <br/><br/><br/>
    <button onclick="reiniciar()" style="background: #95a5a6; font-size: 0.8rem; padding: 5px 10px;">
        ↩️ Empezar la historia desde el principio
    </button>
</div>
    
    
<script>
    let historia = {};

    // 1. Cargamos el archivo JSON de forma oculta al abrir la página
    /*async function cargarHistoria() {
        const respuesta = await fetch('historia.json');
        historia = await respuesta.json();
        mostrarPaso(1); // Empezamos en el paso 1
    }
    let historia = {};*/

// Al abrir la página, cargamos el JSON y comprobamos si hay partida guardada
async function cargarHistoria() {
    const respuesta = await fetch('historia.json');
    historia = await respuesta.json();
    
    // 🔍 BUSCAMOS SI YA JUGÓ ANTES:
    // LocalStorage guarda todo como texto, por eso usamos parseInt para pasarlo a número
    const pasoGuardado = localStorage.getItem('progreso_taquilla13');
    
    if (pasoGuardado) {
        mostrarPaso(parseInt(pasoGuardado));
    } else {
        mostrarPaso(1); // Si es su primera vez, empieza en el paso 1
    }
}

// Modificamos también la función de reiniciar para que borre la memoria
function reiniciar() {
    localStorage.removeItem('progreso_taquilla13'); // Borra la partida guardada
    mostrarPaso(1); // Vuelve al inicio
}

    // 2. Esta función dibuja el paso actual borrando por completo el anterior
    function mostrarPaso(numero) {
    const paso = historia[numero];
    
    // 💾 GUARDAMOS EL AVANCE:
    // Guardamos el número de paso actual en la memoria del navegador
    localStorage.setItem('progreso_taquilla13', numero);
    
    document.getElementById('titulo').innerText = paso.titulo;
    document.getElementById('texto').innerText = paso.texto;
    
    const container = document.getElementById('opciones-container');
    container.innerHTML = ''; // Limpiar contenedor
        
    if (paso.final) {
        // Si es un nodo final, creamos el botón rojo de reiniciar
        const btnReiniciar = document.createElement('button');
        btnReiniciar.innerText = "🔄 Volver a jugar";
        btnReiniciar.className = "restart"; // Para que aplique el CSS rojo
        btnReiniciar.onclick = () => mostrarPaso(1);
        container.appendChild(btnReiniciar);
    } else {
        // Si no es un final, dibuja las opciones normales de la historia
        paso.opciones.forEach(opcion => {
            const boton = document.createElement('button');
            boton.innerText = opcion.texto;
            boton.onclick = () => mostrarPaso(opcion.siguiente);
            container.appendChild(boton);
        });
    }
    window.scrollTo(0, 0);
}

    // Arrancar el juego
    cargarHistoria();
</script>
</body>
</html>
