<div id="resultado"></div>

<script>
const contenedor = document.getElementById('resultado');
  
	const params = new URLSearchParams(window.location.search);	
	let idURL = params.get('id');
	let idTipoURL = params.get('idTipo');
	let mapId = params.get('idMap');
	
    // Cargar XML desde el HTML
    function loadXML(id) {
      const xmlString = document.getElementById(id).textContent.trim();
      const xmlDoc = new DOMParser().parseFromString(xmlString, 'text/xml');
      const items = xmlDoc.getElementsByTagName('marker');

		const p = document.createElement('p');
		let texto='';
		
      for (let i = 0; i < items.length; i++) {
        const type = items[i].getAttribute('type');
		const idMarker = items[i].getAttribute('id');
		const nameMarker = items[i].getAttribute('name');	
		const textoMarker = items[i].getAttribute('texto');	
		
		if(idMarker===idURL){
			p.innerHTML = `<h1>${nameMarker}</h1><br/>${textoMarker}`;
			contenedor.appendChild(p);
		}
		
		
	  }
	}

	loadXML('p1');
  </script>
